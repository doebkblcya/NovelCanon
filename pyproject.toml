[project]
name = "novelcanon"
version = "0.1.0"
description = "将中文长篇小说转换为可追溯、可按章节查询的结构化知识库"
readme = "README.zh-CN.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.15,<1",
    "structlog>=24.4,<25",
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# sqlite-vec 为实验后端，精确锁版（ADR-0006）
vec = ["sqlite-vec==0.1.9"]
# tiktoken 仅为可选计量 adapter（ADR-0006）
tokenizer = ["tiktoken>=0.7,<1"]
# P4 查询 API，阶段 04 前不引入
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
novelcanon = "novelcanon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelcanon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
exclude = ["migrations/"]
